plugins { id 'com.android.application' }

android {
    namespace 'dev.pico.facialprobe'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '26.1.10909125'
    sourceSets { main.java.srcDirs += '../shared/src/main/java' }
    externalNativeBuild { cmake { path '../shared/src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    defaultConfig {
        applicationId 'dev.pico.facialprobe'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '0.1.0-probe'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs { debug { storeFile file('../tools/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
