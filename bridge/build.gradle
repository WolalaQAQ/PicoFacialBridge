plugins { id 'com.android.application' }
android {
    namespace 'dev.pico.facialprobe'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'dev.pico.facialbridge'
        minSdk 29
        targetSdk 29
        versionCode 3
        versionName '0.2.0'
        testInstrumentationRunner 'dev.pico.facialprobe.BridgeUiTest'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main.java.srcDirs += '../shared/src/main/java' }
    externalNativeBuild { cmake { path '../shared/src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
